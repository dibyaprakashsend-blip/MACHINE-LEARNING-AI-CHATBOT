<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Companion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0a0e17;
    --ink-2: #101626;
    --panel: rgba(255, 255, 255, 0.045);
    --panel-border: rgba(255, 255, 255, 0.09);
    --gold: #d9a94f;
    --gold-soft: rgba(217, 169, 79, 0.16);
    --blue: #6f93e8;
    --blue-soft: rgba(111, 147, 232, 0.16);
    --text: #eae6da;
    --text-dim: #8b93a5;
    --serif: 'Fraunces', serif;
    --sans: 'Inter', sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    background: var(--ink);
    color: var(--text);
    font-family: var(--sans);
    overflow: hidden;
  }

  /* ambient background glow — the one deliberate motion on the page */
  .glow {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }
  .glow::before, .glow::after {
    content: "";
    position: absolute;
    width: 46vw;
    height: 46vw;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.35;
    animation: drift 22s ease-in-out infinite alternate;
  }
  .glow::before {
    background: radial-gradient(circle, var(--gold) 0%, transparent 70%);
    top: -12%;
    left: -8%;
  }
  .glow::after {
    background: radial-gradient(circle, var(--blue) 0%, transparent 70%);
    bottom: -18%;
    right: -10%;
    animation-delay: -11s;
  }
  @keyframes drift {
    from { transform: translate(0, 0) scale(1); }
    to   { transform: translate(4%, 3%) scale(1.08); }
  }
  @media (prefers-reduced-motion: reduce) {
    .glow::before, .glow::after { animation: none; }
  }

  .stage {
    position: relative;
    z-index: 1;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px;
    perspective: 1600px;
  }

  .card {
    width: 100%;
    max-width: 760px;
    height: min(84vh, 780px);
    display: flex;
    flex-direction: column;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 20px;
    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);
    box-shadow:
      0 40px 90px -30px rgba(0, 0, 0, 0.65),
      inset 0 1px 0 rgba(255, 255, 255, 0.06);
    transform: rotateX(6deg) translateY(-6px);
    animation: settle 0.9s cubic-bezier(.2, .9, .25, 1) forwards;
    overflow: hidden;
  }
  @keyframes settle {
    from { transform: rotateX(14deg) translateY(20px) scale(0.97); opacity: 0; }
    to   { transform: rotateX(0deg) translateY(0) scale(1); opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .card { animation: none; transform: none; }
  }

  /* header */
  .header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 22px 26px;
    border-bottom: 1px solid var(--panel-border);
    flex-shrink: 0;
  }
  .lamp {
    width: 38px;
    height: 38px;
    border-radius: 11px;
    background: linear-gradient(160deg, var(--gold-soft), transparent);
    border: 1px solid rgba(217, 169, 79, 0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .lamp svg { width: 19px; height: 19px; }
  .header h1 {
    font-family: var(--serif);
    font-weight: 500;
    font-size: 20px;
    margin: 0;
    letter-spacing: 0.2px;
    color: #f2efe6;
  }
  .header p {
    margin: 2px 0 0;
    font-size: 12.5px;
    color: var(--text-dim);
  }
  .status-dot {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    color: var(--text-dim);
  }
  .status-dot span.pip {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #6bce8a;
    box-shadow: 0 0 8px #6bce8a;
  }

  /* messages */
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 26px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .messages::-webkit-scrollbar { width: 8px; }
  .messages::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.08);
    border-radius: 8px;
  }

  .empty-state {
    margin: auto;
    text-align: center;
    max-width: 340px;
    color: var(--text-dim);
  }
  .empty-state .glyph {
    font-family: var(--serif);
    font-size: 40px;
    color: var(--gold);
    opacity: 0.85;
    margin-bottom: 10px;
  }
  .empty-state h2 {
    font-family: var(--serif);
    font-weight: 500;
    font-size: 18px;
    color: var(--text);
    margin: 0 0 6px;
  }
  .empty-state p {
    font-size: 13.5px;
    line-height: 1.55;
    margin: 0;
  }

  .row {
    display: flex;
    gap: 10px;
    max-width: 88%;
    animation: rise 0.35s ease forwards;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .row.user { align-self: flex-end; flex-direction: row-reverse; }
  .row.bot  { align-self: flex-start; }

  .avatar {
    width: 30px;
    height: 30px;
    border-radius: 9px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--serif);
    font-size: 13px;
    margin-top: 2px;
  }
  .row.user .avatar { background: var(--blue-soft); color: var(--blue); border: 1px solid rgba(111,147,232,0.35); }
  .row.bot .avatar { background: var(--gold-soft); color: var(--gold); border: 1px solid rgba(217,169,79,0.35); }

  .bubble {
    padding: 12px 15px;
    border-radius: 14px;
    font-size: 14.5px;
    line-height: 1.6;
    white-space: pre-wrap;
  }
  .row.user .bubble {
    background: var(--blue-soft);
    border: 1px solid rgba(111, 147, 232, 0.28);
    border-top-right-radius: 4px;
    color: #eef1fb;
  }
  .row.bot .bubble {
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--panel-border);
    border-left: 2px solid var(--gold);
    border-top-left-radius: 4px;
  }

  .typing {
    display: flex;
    gap: 4px;
    padding: 4px 2px;
  }
  .typing span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--gold);
    opacity: 0.5;
    animation: bounce 1.1s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  /* input */
  .composer {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    padding: 18px 20px;
    border-top: 1px solid var(--panel-border);
    flex-shrink: 0;
  }
  .composer textarea {
    flex: 1;
    resize: none;
    max-height: 120px;
    background: rgba(255, 255, 255, 0.045);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    padding: 12px 14px;
    line-height: 1.4;
    outline: none;
    transition: border-color 0.15s ease;
  }
  .composer textarea:focus {
    border-color: rgba(217, 169, 79, 0.5);
  }
  .composer textarea::placeholder { color: var(--text-dim); }

  .send-btn {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    border: none;
    background: linear-gradient(155deg, var(--gold), #b9843a);
    color: #1a1400;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    box-shadow: 0 6px 18px -6px rgba(217, 169, 79, 0.55);
  }
  .send-btn:hover { transform: translateY(-1px); }
  .send-btn:active { transform: translateY(0); }
  .send-btn:disabled {
    opacity: 0.4;
    cursor: default;
    transform: none;
  }
  .send-btn svg { width: 17px; height: 17px; }

  .hint {
    text-align: center;
    font-size: 11px;
    color: var(--text-dim);
    padding: 0 20px 14px;
    flex-shrink: 0;
  }

  @media (max-width: 560px) {
    .stage { padding: 0; }
    .card { height: 100vh; max-width: 100%; border-radius: 0; }
    .row { max-width: 96%; }
  }
</style>
</head>
<body>

<div class="glow"></div>

<div class="stage">
  <div class="card">
    <div class="header">
      <div class="lamp">
        <svg viewBox="0 0 24 24" fill="none" stroke="#d9a94f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18h6"/>
          <path d="M10 21h4"/>
          <path d="M12 3a6 6 0 0 0-4.24 10.24c.63.63.99 1.47 1 2.36v.4h6.48v-.4c.01-.89.37-1.73 1-2.36A6 6 0 0 0 12 3Z"/>
        </svg>
      </div>
      <div>
        <h1>Study Companion</h1>
        <p>Answers pulled straight from your book</p>
      </div>
      <div class="status-dot"><span class="pip"></span>ready</div>
    </div>

    <div class="messages" id="messages">
      <div class="empty-state" id="emptyState">
        <div class="glyph">&#8220;</div>
        <h2>Ask your first question</h2>
        <p>Whatever's in the document — a definition, a formula, a summary of a chapter — ask it plainly and I'll answer from the text.</p>
      </div>
    </div>

    <div class="composer">
      <textarea id="input" placeholder="Ask something about your document..." rows="1"></textarea>
      <button class="send-btn" id="sendBtn" aria-label="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m22 2-7 20-4-9-9-4Z"/>
          <path d="M22 2 11 13"/>
        </svg>
      </button>
    </div>
    <div class="hint">Enter to send &middot; Shift + Enter for a new line</div>
  </div>
</div>

<script>
    const messagesEl = document.getElementById('messages');
    const emptyState = document.getElementById('emptyState');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('sendBtn');

    // FastAPI backend
    const API_URL = 'http://127.0.0.1:8000/api/chat';

    function autosize() {
        input.style.height = 'auto';
        input.style.height = Math.min(input.scrollHeight, 120) + 'px';
    }

    input.addEventListener('input', autosize);

    function scrollDown() {
        messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function addRow(text, who) {
        if (emptyState) {
            emptyState.remove();
        }

        const row = document.createElement('div');
        row.className = 'row ' + who;

        const avatar = document.createElement('div');
        avatar.className = 'avatar';
        avatar.textContent = who === 'user' ? 'Y' : 'A';

        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.textContent = text;

        row.appendChild(avatar);
        row.appendChild(bubble);

        messagesEl.appendChild(row);

        scrollDown();

        return bubble;
    }

    function addTyping() {
        const row = document.createElement('div');
        row.className = 'row bot';
        row.id = 'typingRow';

        const avatar = document.createElement('div');
        avatar.className = 'avatar';
        avatar.textContent = 'A';

        const bubble = document.createElement('div');
        bubble.className = 'bubble';

        bubble.innerHTML = `
            <div class="typing">
                <span></span>
                <span></span>
                <span></span>
            </div>
        `;

        row.appendChild(avatar);
        row.appendChild(bubble);

        messagesEl.appendChild(row);

        scrollDown();
    }

    function removeTyping() {
        const row = document.getElementById('typingRow');

        if (row) {
            row.remove();
        }
    }

    async function send() {

        const text = input.value.trim();

        if (!text) {
            return;
        }

        // Show user message
        addRow(text, 'user');

        input.value = '';
        autosize();

        sendBtn.disabled = true;

        // Show typing animation
        addTyping();

        try {

            const response = await fetch(API_URL, {
                method: 'POST',

                headers: {
                    'Content-Type': 'application/json'
                },

                body: JSON.stringify({
                    message: text
                })
            });

            const data = await response.json();

            removeTyping();

            if (!response.ok) {

                addRow(
                    'Server error: ' +
                    (data.error || data.detail || 'Unknown error'),
                    'bot'
                );

            } else {

                let answer = data.response;

                // Convert Gemini's response to plain text.
                if (typeof answer === 'string') {
                    // Already plain text
                } else if (Array.isArray(answer)) {
                    answer = answer.map(item => {
                        if (typeof item === 'string') {
                            return item;
                        }

                        if (item && typeof item === 'object') {
                            if (typeof item.text === 'string') {
                                return item.text;
                            }

                            if (item.type === 'text' && typeof item.text === 'string') {
                                return item.text;
                            }

                            return JSON.stringify(item);
                        }

                        return String(item);
                    }).join('\n');
                } else if (answer && typeof answer === 'object') {
                    if (typeof answer.text === 'string') {
                        answer = answer.text;
                    } else {
                        answer = JSON.stringify(answer, null, 2);
                    }
                } else {
                    answer = String(answer ?? '');
                }

                addRow(
                    answer || 'No response received.',
                    'bot'
                );
            }

        } catch (error) {

            removeTyping();

            console.error('API Error:', error);

            addRow(
                'Could not connect to the AI server. Make sure FastAPI is running on port 8000.',
                'bot'
            );

        } finally {

            sendBtn.disabled = false;

            input.focus();
        }
    }

    // Send button
    sendBtn.addEventListener('click', send);

    // Enter key
    input.addEventListener('keydown', (event) => {

        if (event.key === 'Enter' && !event.shiftKey) {

            event.preventDefault();

            send(); 
        }
    });

    input.focus();
</script>

</body>
</html>
